  .obrigado__texto {

    padding: 16px clamp(16px, 5vw, 28px);
    font-size: clamp(.9rem, 4vw, 1.02rem);

    white-space: nowrap;
  }
  .btn--whats:hover { --btn-bg: #1FBE5B; }
  .btn--whats svg { width: 22px; height: 22px; flex: none; }
  .obrigado__voltar {
    display: inline-block;
    margin-top: 22px;
    font-size: .86rem;
    color: var(--claro-60);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .obrigado__voltar:hover { color: var(--azul); }
  .obrigado__rodape {
    padding: 0 var(--gutter) clamp(20px, 4vw, 32px);
    text-align: center;
    font-size: .78rem;
    color: var(--claro-60);
  }
  @keyframes obrigado-entrada {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: none; }
  }
  @media (max-width: 480px) {
    .btn--whats { width: 100%; }
